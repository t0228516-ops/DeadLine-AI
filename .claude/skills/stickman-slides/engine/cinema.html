<!DOCTYPE html>
<html lang="kk"><head><meta charset="utf-8">
<style>
@font-face{font-family:Caveat;font-weight:700;src:url(fonts/Caveat-700.ttf)}
@font-face{font-family:Caveat;font-weight:400;src:url(fonts/Caveat-400.ttf)}
@font-face{font-family:Nunito;font-weight:400;src:url(fonts/Nunito-400.ttf)}
@font-face{font-family:Nunito;font-weight:700;src:url(fonts/Nunito-700.ttf)}
@font-face{font-family:Mont;font-weight:900;src:url(fonts/Montserrat-900.ttf)}
@font-face{font-family:Mont;font-weight:800;src:url(fonts/Montserrat-800.ttf)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:#000}
svg#stage{position:absolute;inset:0;width:1920px;height:1080px}
/* in-world text (stone slab, cave wall, board): readable, «carved» look */
.tb{width:100%;height:100%;display:flex;flex-direction:column;justify-content:center;gap:18px;font-family:Nunito;color:var(--ink,#2b2621)}
.tb .k{font-family:Mont;font-weight:800;font-size:26px;letter-spacing:.14em;text-transform:uppercase;opacity:.75}
.tb h1{font-family:Mont;font-weight:900;font-size:var(--h1,88px);line-height:1.02;letter-spacing:-.01em}
.tb .big{font-family:Caveat;font-weight:700;font-size:var(--bigfs,132px);line-height:.85;color:var(--acc,#C4561D)}
.tb .lab{font-weight:700;font-size:34px;line-height:1.2;margin-top:-4px}
.tb ul{list-style:none;display:flex;flex-direction:column;gap:10px;margin-top:6px}
.tb li{font-size:34px;line-height:1.26;font-weight:700;padding-left:40px;position:relative}
.tb li:before{content:"";position:absolute;left:4px;top:14px;width:18px;height:18px;border-radius:50%;background:var(--acc,#C4561D)}
.carved{text-shadow:1px 1px 0 rgba(255,255,255,.35),-1px -1px 0 rgba(0,0,0,.25)}
.bub{font-family:Nunito;font-weight:700;color:#1d1d1f;text-align:center;line-height:1.15}
</style>
</head><body>
<svg id="stage" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg"></svg>
<script>window.CINEMA=true</script>
<script src="engine.js"></script>
<script src="cinema.js"></script>
</body></html>
