name: CI
on:
  push:
  pull_request:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install (incl. Chrome for puppeteer)
        run: npm ci
      - name: Fonts for rendering
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-dejavu fonts-liberation >/dev/null
      - run: npm run build
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Visual regression
        run: npm run test:visual
      - name: Upload visual diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diffs
          path: test/visual-regression/__diff__/
          if-no-files-found: ignore
